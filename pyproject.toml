[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netfs"
version = "0.1.0"
description = "net-from-scratch: neural networks and CNNs in NumPy, with every gradient hand-derived, written out in plain maths, and checked against a central-difference numerical gradient."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pratyush Vatsa" }]
keywords = ["backpropagation", "neural-network", "cnn", "convolution", "im2col", "gradient-checking", "numpy", "teaching"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
data = ["scikit-learn>=1.0"]
# The oracles. Nothing in src/netfs imports these.
check = ["scipy>=1.7", "torch>=2.0"]
dev = ["pytest>=7.0", "matplotlib>=3.5", "scipy>=1.7", "scikit-learn>=1.0", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
